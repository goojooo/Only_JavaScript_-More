<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reverse a number</title>
  </head>
  <body>
    <script>
      let num = 12345;
      let rev;
      rev = num.toString().split("").reverse().join("");
      console.log(rev);
    </script>
  </body>
</html>
