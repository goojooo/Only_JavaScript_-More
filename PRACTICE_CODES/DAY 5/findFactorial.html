<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find the factorial of a number</title>
</head>
<body>
    <h1 id="h1"></h1>
    <input type="text" id="myText">
    <input type="submit" id="send">

    <script>
        let num;
        let factorial = 1;
        document.getElementById("send").onclick = function(){
            num = document.getElementById("myText").value;
            for(let i = 1 ; i <= num; ++i)
        {
            factorial *= i;
        }
        document.getElementById("h1").textContent = factorial ;
        }
    </script>
</body>
</html>
